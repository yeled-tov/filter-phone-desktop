name: Build FilterPhone Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "installer/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: filterphone-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q app
          if ($LASTEXITCODE -ne 0) { throw "Python source validation failed." }
          python -c "import tkinter, webbrowser; print('Required standard-library modules are available.')"
          if ($LASTEXITCODE -ne 0) { throw "Required Windows UI modules are unavailable." }

      - name: Build desktop executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FilterPhoneDesktop app/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE." }
          if (!(Test-Path "dist\FilterPhoneDesktop.exe")) { throw "PyInstaller did not create dist\FilterPhoneDesktop.exe." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup (exit code $LASTEXITCODE)." }

      - name: Build installer EXE
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $candidates = @()
          if ($programFilesX86) { $candidates += (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe") }
          if ($programFiles) { $candidates += (Join-Path $programFiles "Inno Setup 6\ISCC.exe") }

          $onPath = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($onPath) { $candidates += $onPath.Source }

          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (!$iscc) {
            Write-Host "Searched for ISCC.exe in:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            throw "Inno Setup compiler was not found in Program Files, Program Files (x86), or PATH."
          }

          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "/Qp" "installer\FilterPhoneDesktop.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $installer = Join-Path $PWD "installer\dist-installer\FilterPhone-Desktop-Setup.exe"
          if (!(Test-Path $installer)) {
            Write-Host "Files found under installer:"
            Get-ChildItem -Path "installer" -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Installer output was not found at $installer."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilterPhone-Desktop-Windows
          path: installer/dist-installer/FilterPhone-Desktop-Setup.exe
          if-no-files-found: error
          retention-days: 14
